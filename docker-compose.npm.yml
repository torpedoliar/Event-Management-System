# ============================================
# Nginx Proxy Manager - Standalone
# ============================================
# Deploy terpisah dari Event Management System
#
# Dashboard Admin NPM: http://<IP_SERVER>:81
# Default login:
#   Email:    admin@example.com
#   Password: changeme
# ============================================

name: nginx-proxy

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      # Port host dapat diubah lewat .env.production (NPM_HTTP_PORT, NPM_HTTPS_PORT,
      # NPM_ADMIN_PORT): sebagian mesin Windows mereservasi port 80/443 untuk
      # Hyper-V sehingga Docker tidak bisa mem-bind-nya.
      - "0.0.0.0:${NPM_HTTP_PORT:-80}:80"
      - "0.0.0.0:${NPM_HTTPS_PORT:-443}:443"
      - "0.0.0.0:${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  npm_data:
  npm_letsencrypt:

networks:
  proxy-network:
    external: true
    name: proxy-network
