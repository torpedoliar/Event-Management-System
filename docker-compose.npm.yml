# ============================================
# Nginx Proxy Manager - Standalone
# ============================================
# Deploy terpisah dari Event Management System
#
# Dashboard Admin NPM: http://<IP_SERVER>:81
# Default login:
#   Email:    admin@example.com
#   Password: changeme
# ============================================

name: nginx-proxy

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"       # HTTP - bind ke semua interface
      - "0.0.0.0:443:443"     # HTTPS - bind ke semua interface
      - "0.0.0.0:81:81"       # Dashboard Admin NPM
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  npm_data:
  npm_letsencrypt:

networks:
  proxy-network:
    external: true
    name: proxy-network
